plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.displayxr.mc3d.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.displayxr.mc3d.bridge'
        minSdk 29
        targetSdk 31   // same as the DisplayXR samples (runtime discovery validated at 31)
        versionCode 60
        versionName '0.6.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
}
